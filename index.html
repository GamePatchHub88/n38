<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing component with toggle</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1 class="header--title">Our Pricing</h1>
        <div class="header--toggle">
          <h3 class="header--h3">Annually</h3>
          <label class="header--label">
            <input type="checkbox" id="check" value="month" class="header-input--check" />
          </label>
          <h3 class="header--h3">Monthly</h3>
        </div>
      </div>
      <div class="con-card">
        <div class="card">
          <h3 class="card--title">Basic</h3>
          <h1 class="card-price price1">$19.99</h1>
          <div class="card-features">
            <h3 class="card-feature">500 GB Storage</h3>
            <h3>2 Users Allowed</h3>
            <h3 class="card-feature">Send up to 3 GB</h3>
          </div>
          <button>Learn More</button>
        </div>
        <div class="card c">
          <h3 class="card--title">Professional</h3>
          <h1 class="card-price price2">$24.99</h1>
          <div class="card-features">
            <h3 class="card-feature">1 TB Storage</h3>
            <h3>5 Users Allowed</h3>
            <h3 class="card-feature">Send up to 10 GB</h3>
          </div>
          <button>Learn More</button>
        </div>
        <div class="card">
          <h3 class="card--title">Master</h3>
          <h1 class="card-price price3">$39.99</h1>
          <div class="card-features">
            <h3 class="card-feature">2 TB Storage</h3>
            <h3>10 Users Allowed</h3>
            <h3 class="card-feature">Send up to 20 GB</h3>
          </div>
          <button>Learn More</button>
        </div>
      </div>
    </div>

    <script src="./scripts/script.js"></script>
  </body>
</html>
